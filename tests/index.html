<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نتائج الاختبار التجريبي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column with the student lookup */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --fg:#14231d; --muted:#5a6b63; --line:#d6e0da; --track:#e6ede9;
  --accent:#0b6b4f; --accent-fg:#ffffff; --accent-soft:#e1f0e9;
  --s-all:#0b6b4f; --s-q:#2a78d6; --s-v:#eb6834;
  --good:#1b7a3d; --bad:#b3342f; --warn:#8a5a00; --err-bg:#fbeaea; --err:#a32b2b;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1815; --surface:#17231e; --fg:#e7f0ec; --muted:#98aaa1; --line:#2b3d35; --track:#233229;
  --accent:#4ec29a; --accent-fg:#06231a; --accent-soft:#1c3329;
  --s-all:#4ec29a; --s-q:#3987e5; --s-v:#d95926; --good:#5fd08a; --bad:#ff8f89; --warn:#e6b450; --err-bg:#3a1d1d; --err:#ff9a9a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1815; --surface:#17231e; --fg:#e7f0ec; --muted:#98aaa1; --line:#2b3d35; --track:#233229;
  --accent:#4ec29a; --accent-fg:#06231a; --accent-soft:#1c3329;
  --s-all:#4ec29a; --s-q:#3987e5; --s-v:#d95926; --good:#5fd08a; --bad:#ff8f89; --warn:#e6b450; --err-bg:#3a1d1d; --err:#ff9a9a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.7;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.2rem} h3{font-size:1rem}
.school{font-size:.9rem;font-weight:600;color:var(--accent);letter-spacing:.02em}
.sub{color:var(--muted);margin:4px 0 0}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end}
nav{display:flex;gap:8px;flex-wrap:wrap}
a.btn,button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--accent);color:var(--accent-fg);text-decoration:none;display:inline-block}
a.btn.alt,button.alt{background:var(--accent-soft);color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.card>h2{margin-bottom:4px}
.note{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{font-size:.82rem;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:1.9rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .d{font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:baseline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.seg button{border-radius:0;background:transparent;color:var(--fg);font-weight:500;padding:7px 16px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.rows{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:2.2rem minmax(7.5rem,11rem) 1fr;gap:10px;align-items:center;min-width:0}
#qItems .row,#vItems .row{align-items:start}
.rk{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.nm{font-weight:500;min-width:0}
.nm small{display:block;color:var(--muted);font-size:.78rem}
.bar{position:relative;height:26px;background:var(--track);border-radius:4px;min-width:0}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:0 4px 4px 0;background:var(--c,var(--s-all))}
[dir=rtl] .bar i{border-radius:4px 0 0 4px}
.bar b{position:absolute;inset-block:0;inset-inline-end:8px;display:flex;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.bar.sm{height:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
.mini{display:flex;gap:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap;margin-top:2px}
.tag{font-size:.72rem;font-weight:600;border-radius:4px;padding:1px 7px;margin-inline-start:6px;vertical-align:middle}
.tag.e{background:var(--accent-soft);color:var(--good)} .tag.h{background:var(--err-bg);color:var(--bad)} .tag.u{background:var(--track);color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:170px;margin-top:8px}
.hist div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:.8rem;min-width:0}
.hist span.b{width:100%;border-radius:4px 4px 0 0;background:var(--c,var(--s-all));min-height:2px}
.hist small{color:var(--muted);font-size:.72rem;text-align:center;line-height:1.2}
.prose p{margin:0 0 10px;max-width:72ch} .prose h3{margin:14px 0 6px;color:var(--accent)}
.prose ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;max-width:76ch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:6px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.8rem}
.scroll{overflow-x:auto}
details{margin-top:8px} summary{cursor:pointer;font-weight:600;color:var(--accent)}
form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;max-width:520px}
form div{flex:1 1 240px}
label{display:block;font-weight:600;margin-bottom:4px}
input{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;direction:ltr;text-align:right}
.msg{padding:10px 12px;border-radius:8px;background:var(--err-bg);color:var(--err);font-weight:500;margin-top:10px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;margin:16px 0}
.info dt{font-size:.8rem;color:var(--muted)} .info dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.sc>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sc .big{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{min-width:2.3rem;text-align:center;border-radius:6px;padding:2px 8px;font-size:.82rem;font-weight:600;border:1px solid var(--line)}
.chip.ok{background:var(--accent-soft);color:var(--good)} .chip.no{background:var(--err-bg);color:var(--bad)} .chip.na{color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:plaintext;text-align:right}
#err{display:none}
@media (max-width:560px){.row{grid-template-columns:1.8rem 1fr}.row>.bar,.row>div{grid-column:1/-1}h1{font-size:1.4rem}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="school">كرامة الأحمر الثانوية - مسارات</div>
      <h1>نتائج الاختبار التجريبي</h1>
      <p class="sub">الاختبار التجريبي: الكمي واللفظي</p>
    </div>
  </header>

    <section class="card" id="lookup">
    <h2>استعلام الطالب</h2>
    <p class="note">اكتب رقم السجل المدني لعرض نتيجتك في الاختبارين وترتيبك.</p>
    <form id="f" autocomplete="off">
      <div><label for="nid">السجل المدني</label><input id="nid" inputmode="numeric" required></div>
      <button id="go" type="submit">استعلام</button>
    </form>
    <div id="err" class="msg" role="alert"></div>
    <div id="res" aria-live="polite"></div>
  </section>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)},DATA=null,mode='C';
var f1=function(x){return (Math.round(x*10)/10).toFixed(1)};
var AR='٠١٢٣٤٥٦٧٨٩';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function opt(o){return String(o).replace(/ا/g,'أ')}
var COL={C:'var(--s-all)',Q:'var(--s-q)',V:'var(--s-v)'},NAME={C:'المتوسط العام',Q:'الكمي',V:'اللفظي'};
function bar(v,c,label,sm){return '<div class="bar'+(sm?' sm':'')+'" title="'+esc(label)+'"><i style="width:'+Math.max(0,Math.min(100,v))+'%;--c:'+c+'"></i><b>'+f1(v)+'%</b></div>'}

/* ---- lookup ---- */
var enc=new TextEncoder();
function b64u8(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function normId(s){return s.replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/\D/g,'').replace(/^0+/,'')}
function fail(t){var e=$('err');e.textContent=t;e.style.display='block';$('res').innerHTML='';$('go').disabled=false;$('go').textContent='استعلام'}
function chips(it,n){var o='';for(var i=0;i<n;i++){var v=it[i];o+='<span class="chip '+(v==null?'na':v?'ok':'no')+'" title="س'+(i+1)+'">'+(i+1)+(v==null?'':v?' ✓':' ✗')+'</span>'}return o}
function show(p){
  var h='<dl class="info"><div><dt>اسم الطالب</dt><dd>'+esc(p.n)+'</dd></div><div><dt>السجل المدني</dt><dd class="ltr">'+esc(p.i)+'</dd></div><div><dt>الصف</dt><dd>'+esc(p.g||'-')+'</dd></div><div><dt>الفصل</dt><dd>'+esc(p.s||'-')+'</dd></div></dl><div class="sc">';
  if(p.avg!=null){h+='<div style="border-color:var(--s-all)"><div class="l note"><span class="dot" style="background:var(--s-all)"></span>المتوسط العام</div><div class="big">'+f1(p.avg)+'%</div><div>المستوى: '+esc(p.lvl)+'</div></div>'}
  if(p.q){h+='<div><div class="l note"><span class="dot" style="background:var(--s-q)"></span>الاختبار الكمي</div><div class="big">'+p.q.sc+' / 16</div><div>'+f1(p.q.pct)+'% - زمن الحل '+f1(p.q.t)+' د</div><div class="chips">'+chips(p.q.it,8)+'</div></div>'}
  else h+='<div><div class="l note">الاختبار الكمي</div><div>لم يؤدِّ الاختبار</div></div>';
  if(p.v){h+='<div><div class="l note"><span class="dot" style="background:var(--s-v)"></span>الاختبار اللفظي</div><div class="big">'+p.v.sc+' / 10</div><div>'+f1(p.v.pct)+'% - زمن الحل '+f1(p.v.t)+' د</div><div class="chips">'+chips(p.v.it,10)+'</div></div>'}
  else h+='<div><div class="l note">الاختبار اللفظي</div><div>لم يؤدِّ الاختبار</div></div>';
  h+='</div>';
  if(p.avg!=null){
    h+='<table><tr><th>الترتيب</th><th>ترتيبك</th><th>متوسط المجموعة</th></tr>';
    if(p.rc)h+='<tr><td>في الشعبة</td><td>'+p.rc+' من '+p.rcn+'</td><td>'+f1(p.ca)+'%</td></tr>';
    if(p.rg)h+='<tr><td>في الصف</td><td>'+p.rg+' من '+p.rgn+'</td><td>'+f1(p.ga)+'%</td></tr>';
    h+='<tr><td>في المدرسة</td><td>'+p.rk+' من '+p.rkn+'</td><td>-</td></tr></table>';
    if(p.q&&p.q.t<1||p.v&&p.v.t<1)h+='<p class="note" style="margin-top:10px">ملاحظة: أُنهي أحد الاختبارين في أقل من دقيقة، وقد لا تعبّر نتيجته عن مستواك. يُنصح بإعادته.</p>';
  }else h+='<p class="note">يظهر المتوسط والترتيب بعد أداء الاختبارين.</p>';
  h+='<p class="note">الاختبار تجريبي وليس نتيجة نهائية. علامة ✓ تعني إجابة صحيحة. الاختبار الكمي من 8 أسئلة مصححة.</p>';
  $('res').innerHTML=h;$('err').style.display='none';$('go').disabled=false;$('go').textContent='استعلام';
}
async function aesDec(key,blob){var d=b64u8(blob),k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},k,d.slice(12)))}
$('f').addEventListener('submit',async function(ev){
  ev.preventDefault();var id=normId($('nid').value);
  if(id.length<6)return fail('اكتب رقم السجل المدني كاملا.');
  $('go').disabled=true;$('go').textContent='جار الاستعلام...';
  try{
    var H=hex(await crypto.subtle.digest('SHA-256',enc.encode('t|'+id)));
    var w=DATA.stu[H];if(!w)return fail('لم يتم العثور على نتيجة بهذا الرقم. تأكد من السجل المدني.');
    var km=await crypto.subtle.importKey('raw',enc.encode('k|'+id),'PBKDF2',false,['deriveBits']);
    var Kd=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode('tests-1447'),iterations:50000},km,256));
    show(JSON.parse(new TextDecoder().decode(await aesDec(Kd,w))));
  }catch(e){fail('تعذر عرض النتيجة. حاول مرة أخرى.')}
});
fetch('data.json').then(function(r){return r.json()}).then(function(j){
  DATA={stu:j.stu};
}).catch(function(){document.body.insertAdjacentHTML('afterbegin','<p class="msg">تعذر تحميل البيانات.</p>')});
})();
</script>
</body>
</html>
